dataset_description:
  Name: "MIMOSA Microscopy Dataset"
  BIDSVersion: "1.8.0"
  DatasetType: "raw"

participants_json:
  participant_id:
    Description: "Unique participant ID"

  sex:
    Description: "sex of the participant"
    Levels:
      M: "male"
      F: "female"

  species:
    Description: " "

participants_tsv:
  columns: ["participant_id", "species"]
  rows:
    - participant_id: "sub-Fenouil"
      species: "Marmouset"

    - participant_id: "sub-Nuphar"
      species: "Marmouset"
      

derivatives:
  downsampled:
    dataset_description:
      Name: "Downsampled microscopy images"
      BIDSVersion: "1.8.0"
      DatasetType: "derivative"
      GeneratedBy:
        - Name: "mimosa_hpc_convert"
          Version: "1.0"
          Description: "Downsampled conversion of CZI microscopy images"
      
samples:
  - path: "/envau/work/nit/users/boudlal.h/original-dataset/1-Fenouil-MTO10092101"
    subject: "Fenouil"
    samples:
      - sample_id: "sample-Cx"
        sample_type: "tissue"
        sample_info: "cortex tissue "
      

  - path: "/envau/work/nit/users/boudlal.h/original-dataset/2-Nuphar-MJO17020301"
    subject: "Nuphar"
    samples:
      - sample_id: "sample-Cx"
        sample_type: "tissue"
        sample_info: "cortex tissue "
