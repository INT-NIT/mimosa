dataset_description:
  Name: "MIMOSA Microscopy Dataset"
  BIDSVersion: "1.11.1"
  DatasetType: "raw"

participants_json:
  participant_id:
    Description: "Unique participant ID"

  species:
    Description: " "

participants_tsv:
  columns: ["participant_id", "species"]
  rows:
    - participant_id: "sub-Fenouil"
      species: "Marmouset"

    - participant_id: "sub-Nuphar"
      species: "Marmouset"
      
# est ce que on doit creer plusiuers pipelines ici ou pas ? 
derivatives:
  downsampled:
    dataset_description:
      Name: "Downsampled microscopy images"
      BIDSVersion: "1.11.1"
      DatasetType: "derivative"
      GeneratedBy:
        - Name: "mimosa_hpc_convert"
          Description: "Downsampled conversion of CZI microscopy images"
      
samples:          
  columns: ["sample_id", "participant_id", "sample_type", "sample_info"]
